name: ADR Agronomic Policy Compilation

on:
  pull_request:
    paths:
      - 'packages/agronomic-policy-compilation/**'
      - 'acceptance/agronomic-policy-compilation/**'
      - 'acceptance/gold-protocol-kbs-2015/**'
      - 'acceptance/gold-recorded-operation-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-semantic-normalization-sustainable-corn/**'
      - 'docs/decisions/DEC-0002-AGRONOMIC-POLICY-COMPILATION.md'
      - 'docs/decisions/DEC-0003-AGRONOMIC-RULE-V2-TEMPORAL-COORDINATION.md'
      - 'docs/decisions/DEC-0004-AGRONOMIC-POLICY-CONSTRAINT-COMPILATION.md'
      - 'docs/decisions/DEC-0006-AGRONOMIC-POLICY-OBLIGATION-COMPILATION.md'
      - 'docs/decisions/DEC-0007-AGRONOMIC-NORMATIVE-MODALITY-COMPILATION.md'
      - 'docs/decisions/DEC-0008-AGRONOMIC-GOAL-CONDITION-COMPILATION.md'
      - 'docs/decisions/DEC-0009-AGRONOMIC-ACTION-REGIMEN-COMPILATION.md'
      - 'docs/decisions/DEC-0010-AGRONOMIC-ACTION-REALIZATION-COMPILATION.md'
      - 'docs/decisions/DEC-0011-CONDITIONAL-AGRONOMIC-ACTION-REALIZATION-COMPILATION.md'
      - 'docs/decisions/DEC-0012-AGRONOMIC-SOURCE-AUTHORITY-ROUTING.md'
      - 'docs/decisions/DEC-0013-AGRONOMIC-RECORDED-OPERATION-OCCURRENCE-COMPILATION.md'
      - '.github/workflows/agronomic-policy-compilation.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Report runtime
        run: node --version
      - name: Constitutional static checks
        run: npm run check:constitution
      - name: Agronomic policy compilation contract tests
        run: node --test packages/agronomic-policy-compilation/test/*.test.mjs
      - name: Agronomic policy compilation authority acceptance
        run: node acceptance/agronomic-policy-compilation/run.mjs
      - name: Agronomic policy constraint authority acceptance
        run: node acceptance/agronomic-policy-compilation/constraint.mjs
      - name: Agronomic policy obligation authority acceptance
        run: node acceptance/agronomic-policy-compilation/obligation.mjs
      - name: Agronomic normative modality authority acceptance
        run: node acceptance/agronomic-policy-compilation/modality.mjs
      - name: Agronomic goal-condition authority acceptance
        run: node acceptance/agronomic-policy-compilation/goal.mjs
      - name: Agronomic action-regimen authority acceptance
        run: node acceptance/agronomic-policy-compilation/regimen.mjs
      - name: Agronomic action-realization authority acceptance
        run: node acceptance/agronomic-policy-compilation/realization.mjs
      - name: Agronomic conditional action-realization authority acceptance
        run: node acceptance/agronomic-policy-compilation/conditional-realization.mjs
      - name: Agronomic source-authority routing acceptance
        run: node acceptance/agronomic-policy-compilation/source-routing.mjs
      - name: Agronomic recorded-operation occurrence authority acceptance
        run: node acceptance/agronomic-policy-compilation/recorded-occurrence.mjs
      - name: Sustainable Corn recorded-operation Gold acceptance
        run: npm run test:gold-recorded-operation-sustainable-corn
      - name: Sustainable Corn semantic-normalization Gold acceptance
        run: npm run test:gold-recorded-operation-semantic-normalization-sustainable-corn
      - name: KBS 2015 gold protocol rule, constraint, obligation, modality, goal, regimen, realization, conditional realization and source routing acceptance
        run: npm run test:gold-protocol-kbs-2015
