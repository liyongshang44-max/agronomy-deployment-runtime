name: ADR Agronomic Policy Compilation

on:
  pull_request:
    paths:
      - 'packages/agronomic-policy-compilation/**'
      - 'acceptance/agronomic-policy-compilation/**'
      - 'acceptance/gold-protocol-kbs-2015/**'
      - 'acceptance/gold-recorded-operation-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-semantic-normalization-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-target-identity-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-semantic-mapping-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-epistemic-classification-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-provenance-classification-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-source-provider-identity-binding-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-source-reference-hash-projection-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-temporal-support-classification-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-source-native-timezone-identity-binding-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-spatial-support-classification-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-non-quantitative-unit-representation-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-vertical-support-non-applicability-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-uncertainty-unknown-representation-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-target-ref-farm-instance-projection-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-source-acquisition-availability-projection-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-calendar-date-local-civil-frame-binding-sustainable-corn/**'
      - 'acceptance/gold-recorded-operation-context-historical-timezone-boundary-resolution-sustainable-corn/**'
      - 'docs/decisions/DEC-0002-AGRONOMIC-POLICY-COMPILATION.md'
      - 'docs/decisions/DEC-0003-AGRONOMIC-RULE-V2-TEMPORAL-COORDINATION.md'
      - 'docs/decisions/DEC-0004-AGRONOMIC-POLICY-CONSTRAINT-COMPILATION.md'
      - 'docs/decisions/DEC-0006-AGRONOMIC-POLICY-OBLIGATION-COMPILATION.md'
      - 'docs/decisions/DEC-0007-AGRONOMIC-NORMATIVE-MODALITY-COMPILATION.md'
      - 'docs/decisions/DEC-0008-AGRONOMIC-GOAL-CONDITION-COMPILATION.md'
      - 'docs/decisions/DEC-0009-AGRONOMIC-ACTION-REGIMEN-COMPILATION.md'
      - 'docs/decisions/DEC-0010-AGRONOMIC-ACTION-REALIZATION-COMPILATION.md'
      - 'docs/decisions/DEC-0011-CONDITIONAL-AGRONOMIC-ACTION-REALIZATION-COMPILATION.md'
      - 'docs/decisions/DEC-0012-AGRONOMIC-SOURCE-AUTHORITY-ROUTING.md'
      - 'docs/decisions/DEC-0013-AGRONOMIC-RECORDED-OPERATION-OCCURRENCE-COMPILATION.md'
      - 'docs/decisions/DEC-0015-AGRONOMIC-RECORDED-OPERATION-SOURCE-NATIVE-TARGET-IDENTITY.md'
      - 'docs/decisions/DEC-0016-AGRONOMIC-RECORDED-OPERATION-CONTEXT-SEMANTIC-MAPPING.md'
      - 'docs/decisions/DEC-0017-AGRONOMIC-RECORDED-OPERATION-CONTEXT-EPISTEMIC-CLASSIFICATION.md'
      - 'docs/decisions/DEC-0018-AGRONOMIC-RECORDED-OPERATION-CONTEXT-PROVENANCE-CLASSIFICATION.md'
      - 'docs/decisions/DEC-0019-AGRONOMIC-CONTEXT-SOURCE-PROVIDER-IDENTITY-BINDING.md'
      - 'docs/decisions/DEC-0020-AGRONOMIC-CONTEXT-SOURCE-REFERENCE-AND-CONTENT-HASH-PROJECTION.md'
      - 'docs/decisions/DEC-0021-AGRONOMIC-CONTEXT-TEMPORAL-SUPPORT-CLASSIFICATION.md'
      - 'docs/decisions/DEC-0022-AGRONOMIC-SOURCE-NATIVE-TIMEZONE-IDENTITY-BINDING.md'
      - 'docs/decisions/DEC-0023-AGRONOMIC-CONTEXT-SPATIAL-SUPPORT-CLASSIFICATION.md'
      - 'docs/decisions/DEC-0024-AGRONOMIC-CONTEXT-NON-QUANTITATIVE-UNIT-REPRESENTATION.md'
      - 'docs/decisions/DEC-0025-AGRONOMIC-CONTEXT-VERTICAL-SUPPORT-NON-APPLICABILITY.md'
      - 'docs/decisions/DEC-0026-AGRONOMIC-CONTEXT-UNCERTAINTY-UNKNOWN-REPRESENTATION.md'
      - 'docs/decisions/DEC-0027-AGRONOMIC-CONTEXT-TARGET-REF-FARM-INSTANCE-PROJECTION.md'
      - 'docs/decisions/DEC-0028-AGRONOMIC-CONTEXT-SOURCE-ACQUISITION-AVAILABILITY-PROJECTION.md'
      - 'docs/decisions/DEC-0029-AGRONOMIC-CONTEXT-CALENDAR-DATE-LOCAL-CIVIL-FRAME-BINDING.md'
      - 'docs/decisions/DEC-0030-AGRONOMIC-CONTEXT-HISTORICAL-TIMEZONE-BOUNDARY-RESOLUTION.md'
      - '.github/workflows/agronomic-policy-compilation.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Report runtime
        run: node --version
      - name: Constitutional static checks
        run: npm run check:constitution
      - name: Agronomic policy compilation contract tests
        run: node --test packages/agronomic-policy-compilation/test/*.test.mjs
      - name: Agronomic policy compilation authority acceptance
        run: node acceptance/agronomic-policy-compilation/run.mjs
      - name: Agronomic policy constraint authority acceptance
        run: node acceptance/agronomic-policy-compilation/constraint.mjs
      - name: Agronomic policy obligation authority acceptance
        run: node acceptance/agronomic-policy-compilation/obligation.mjs
      - name: Agronomic normative modality authority acceptance
        run: node acceptance/agronomic-policy-compilation/modality.mjs
      - name: Agronomic goal-condition authority acceptance
        run: node acceptance/agronomic-policy-compilation/goal.mjs
      - name: Agronomic action-regimen authority acceptance
        run: node acceptance/agronomic-policy-compilation/regimen.mjs
      - name: Agronomic action-realization authority acceptance
        run: node acceptance/agronomic-policy-compilation/realization.mjs
      - name: Agronomic conditional action-realization authority acceptance
        run: node acceptance/agronomic-policy-compilation/conditional-realization.mjs
      - name: Agronomic source-authority routing acceptance
        run: node acceptance/agronomic-policy-compilation/source-routing.mjs
      - name: Agronomic recorded-operation occurrence authority acceptance
        run: node acceptance/agronomic-policy-compilation/recorded-occurrence.mjs
      - name: Sustainable Corn recorded-operation Gold acceptance
        run: npm run test:gold-recorded-operation-sustainable-corn
      - name: Sustainable Corn semantic-normalization Gold acceptance
        run: npm run test:gold-recorded-operation-semantic-normalization-sustainable-corn
      - name: Sustainable Corn target-identity Gold acceptance
        run: npm run test:gold-recorded-operation-target-identity-sustainable-corn
      - name: Sustainable Corn context-semantic-mapping Gold acceptance
        run: npm run test:gold-recorded-operation-context-semantic-mapping-sustainable-corn
      - name: Sustainable Corn context-epistemic-classification Gold acceptance
        run: npm run test:gold-recorded-operation-context-epistemic-classification-sustainable-corn
      - name: Sustainable Corn context-provenance-classification Gold acceptance
        run: npm run test:gold-recorded-operation-context-provenance-classification-sustainable-corn
      - name: Sustainable Corn context-source-provider-identity-binding Gold acceptance
        run: npm run test:gold-recorded-operation-context-source-provider-identity-binding-sustainable-corn
      - name: Sustainable Corn context-source-reference-hash-projection Gold acceptance
        run: npm run test:gold-recorded-operation-context-source-reference-hash-projection-sustainable-corn
      - name: Sustainable Corn context-temporal-support-classification Gold acceptance
        run: npm run test:gold-recorded-operation-context-temporal-support-classification-sustainable-corn
      - name: Sustainable Corn source-native-timezone-identity-binding Gold acceptance
        run: npm run test:gold-recorded-operation-context-source-native-timezone-identity-binding-sustainable-corn
      - name: Sustainable Corn context-spatial-support-classification Gold acceptance
        run: npm run test:gold-recorded-operation-context-spatial-support-classification-sustainable-corn
      - name: Sustainable Corn context-non-quantitative-unit-representation Gold acceptance
        run: npm run test:gold-recorded-operation-context-non-quantitative-unit-representation-sustainable-corn
      - name: Sustainable Corn context-vertical-support-non-applicability Gold acceptance
        run: npm run test:gold-recorded-operation-context-vertical-support-non-applicability-sustainable-corn
      - name: Sustainable Corn context-uncertainty-unknown-representation Gold acceptance
        run: npm run test:gold-recorded-operation-context-uncertainty-unknown-representation-sustainable-corn
      - name: Sustainable Corn context-target-ref-farm-instance-projection Gold acceptance
        run: npm run test:gold-recorded-operation-context-target-ref-farm-instance-projection-sustainable-corn
      - name: Sustainable Corn context-source-acquisition-availability-projection Gold acceptance
        run: npm run test:gold-recorded-operation-context-source-acquisition-availability-projection-sustainable-corn
      - name: Sustainable Corn context-calendar-date-local-civil-frame-binding Gold acceptance
        run: npm run test:gold-recorded-operation-context-calendar-date-local-civil-frame-binding-sustainable-corn
      - name: Sustainable Corn context-historical-timezone-boundary-resolution Gold acceptance
        run: npm run test:gold-recorded-operation-context-historical-timezone-boundary-resolution-sustainable-corn
      - name: KBS 2015 gold protocol rule, constraint, obligation, modality, goal, regimen, realization, conditional realization and source routing acceptance
        run: npm run test:gold-protocol-kbs-2015
