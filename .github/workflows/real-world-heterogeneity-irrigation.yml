name: ADR Real-World Heterogeneity — Irrigation

on:
  push:
    branches:
      - 'test/real-world-heterogeneity-irrigation-*'
    paths:
      - 'acceptance/real-kbs-rge-irrigation-target-context-a03/**'
      - '.github/workflows/real-world-heterogeneity-irrigation.yml'
  pull_request:
    paths:
      - 'acceptance/real-kbs-rge-irrigation-target-context-a03/**'
      - '.github/workflows/real-world-heterogeneity-irrigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  irrigation_target_ingestion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Report runtime
        run: node --version
      - name: Real KBS RGE irrigation target A03-A04 ingestion proof
        run: node acceptance/real-kbs-rge-irrigation-target-context-a03/run.mjs
