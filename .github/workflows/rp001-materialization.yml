name: ADR RP001 Materialization

on:
  push:
    branches:
      - "feat/real-paper-benchmark-v1"
    paths:
      - "scripts/real-paper-benchmark/materialize-rp001.mjs"
      - "acceptance/real-paper-benchmark/materialization.mjs"
      - "docs/implementation/real-paper-benchmark/corpus-v1.json"
      - ".github/workflows/rp001-materialization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    name: Rights-enforced RP001 exact artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      ADR_EXTRACTION_MODEL: ""
      ADR_SOURCE_FAITHFUL_REVIEW_MODEL: ""
      ADR_CODE_HEAD_SHA: ${{ github.sha }}
      ADR_RP001_OUTPUT_DIR: .adr-benchmark/rp001
      ADR_RP001_OPERATOR_ID: rp001-github-materializer
      ADR_RIGHTS_JURISDICTION: UNSPECIFIED
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Resolve current PMC OA resource
        id: oa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .adr-benchmark/acquisition
          python - <<'PY'
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          pmcid = "PMC9656380"
          api = f"https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi?id={pmcid}"
          req = urllib.request.Request(api, headers={"User-Agent": "ADR-RP001-Benchmark/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read()
          open(".adr-benchmark/acquisition/oa-response.xml", "wb").write(raw)
          root = ET.fromstring(raw)
          error = root.find(".//error")
          if error is not None:
              raise SystemExit(f"PMC OA API error: {''.join(error.itertext()).strip()}")
          record = root.find(".//record")
          if record is None or record.get("id") != pmcid:
              raise SystemExit("PMC OA API did not return exact RP001 PMCID")
          links = {link.get("format"): link.get("href") for link in record.findall("link") if link.get("format") and link.get("href")}
          fmt = "pdf" if "pdf" in links else "tgz" if "tgz" in links else None
          if not fmt:
              raise SystemExit("PMC OA API returned neither pdf nor tgz resource")
          href = links[fmt]
          if href.startswith("ftp://ftp.ncbi.nlm.nih.gov/"):
              download = "https://ftp.ncbi.nlm.nih.gov/" + href[len("ftp://ftp.ncbi.nlm.nih.gov/"):]
          elif href.startswith("https://"):
              download = href
          else:
              raise SystemExit(f"unsupported PMC OA resource scheme: {href}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"format={fmt}\n")
              out.write(f"resource_href={href}\n")
              out.write(f"download_url={download}\n")
          PY

      - name: Download exact OA resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .adr-benchmark/acquisition/package
          if [ "${{ steps.oa.outputs.format }}" = "pdf" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "ADR-RP001-Benchmark/1.0" \
              "${{ steps.oa.outputs.download_url }}" \
              --output .adr-benchmark/acquisition/rp001.pdf
            printf '%s\n' "${{ steps.oa.outputs.resource_href }}" > .adr-benchmark/acquisition/locator.txt
          else
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "ADR-RP001-Benchmark/1.0" \
              "${{ steps.oa.outputs.download_url }}" \
              --output .adr-benchmark/acquisition/rp001.tar.gz
            tar -xzf .adr-benchmark/acquisition/rp001.tar.gz -C .adr-benchmark/acquisition/package
            python - <<'PY'
            from pathlib import Path

            root = Path('.adr-benchmark/acquisition/package')
            pdfs = sorted(path for path in root.rglob('*.pdf') if path.is_file())
            preferred = [path for path in pdfs if path.name.lower() == 'plants-11-03007.pdf']
            if not preferred:
                preferred = [path for path in pdfs if '3007' in path.name.lower() and 'supp' not in path.name.lower()]
            if len(preferred) != 1:
                if len(pdfs) == 1:
                    preferred = pdfs
                else:
                    raise SystemExit(f"cannot uniquely identify primary RP001 PDF; candidates={[str(p) for p in pdfs]}")
            selected = preferred[0]
            target = Path('.adr-benchmark/acquisition/rp001.pdf')
            target.write_bytes(selected.read_bytes())
            relative = selected.relative_to(root).as_posix()
            href = "${{ steps.oa.outputs.resource_href }}"
            Path('.adr-benchmark/acquisition/locator.txt').write_text(f"{href}#{relative}\n", encoding='utf-8')
            PY
          fi
          test -s .adr-benchmark/acquisition/rp001.pdf
          head -c 5 .adr-benchmark/acquisition/rp001.pdf | grep -q '%PDF-'

      - name: Materialize through RA02 rights-enforced path
        shell: bash
        run: |
          set -euo pipefail
          export ADR_RP001_PDF_PATH="$PWD/.adr-benchmark/acquisition/rp001.pdf"
          export ADR_RP001_ACQUISITION_LOCATOR="$(cat .adr-benchmark/acquisition/locator.txt)"
          node scripts/real-paper-benchmark/materialize-rp001.mjs

      - name: Assert no model execution
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('.adr-benchmark/rp001/rp001-materialization-evidence.json', 'utf8'));
          const expected = {
            llmInvoked: false,
            externalModelEgress: false,
            extractionPerformed: false,
            automatedReviewPerformed: false
          };
          if (JSON.stringify(evidence.modelExecution) !== JSON.stringify(expected)) {
            throw new Error(`unexpected model execution state: ${JSON.stringify(evidence.modelExecution)}`);
          }
          if (evidence.codeHeadSha !== process.env.GITHUB_SHA) throw new Error('materialization code head mismatch');
          console.log(JSON.stringify({
            paperId: evidence.paperId,
            contentHash: evidence.source.contentHash,
            byteLength: evidence.source.byteLength,
            sourceArtifactRef: evidence.source.sourceArtifactRef,
            retentionRightsDecisionRef: evidence.rights.retentionRightsDecisionRef
          }, null, 2));
          NODE

      - name: Upload exact materialization authority world
        uses: actions/upload-artifact@v4
        with:
          name: rp001-materialization-${{ github.sha }}
          path: |
            .adr-benchmark/rp001/
            .adr-benchmark/acquisition/oa-response.xml
            .adr-benchmark/acquisition/locator.txt
          if-no-files-found: error
          retention-days: 30
