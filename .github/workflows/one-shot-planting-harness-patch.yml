name: One-shot Planting Harness Patch

on:
  push:
    branches:
      - 'test/real-world-heterogeneity-planting-soybean-population-v1'
    paths:
      - '.github/workflows/one-shot-planting-harness-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/real-world-heterogeneity-planting-soybean-population-v1
          fetch-depth: 0
      - name: Apply exact canonical-shape assertion fix and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('acceptance/real-kbs-soybean-planting-population-target/run-runtime-composition-v1.mjs')
          s = p.read_text()
          old = "assert.equal(knowledge.semanticPayload.limitations[0].code, EXPECTED_LIMITATION_CODE);"
          new = "assert.equal(knowledge.semanticPayload.limitations[0].value.code, EXPECTED_LIMITATION_CODE);"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one canonical-shape assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          Path('.github/workflows/one-shot-planting-harness-patch.yml').unlink()
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "test(adr): fix planting qualification limitation assertion shape"
          git push origin HEAD:test/real-world-heterogeneity-planting-soybean-population-v1
