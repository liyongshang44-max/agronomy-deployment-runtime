name: ADR Real Paper Benchmark

on:
  push:
    branches:
      - "feat/real-paper-benchmark-v1"
  pull_request:
    paths:
      - "benchmarks/real-paper-v1/**"
      - "scripts/real-paper-benchmark/**"
      - "acceptance/real-paper-benchmark/**"
      - ".github/workflows/real-paper-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-contract:
    name: Real-paper benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Benchmark acceptance
        run: node acceptance/real-paper-benchmark/run.mjs

      - name: Full ADR regression
        run: npm test
