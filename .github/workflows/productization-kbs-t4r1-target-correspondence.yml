name: ADR Productization — KBS T4R1 Target Correspondence

on:
  push:
    branches:
      - 'test/productization-kbs-t4r1-target-correspondence-*'
    paths:
      - 'adapters/geox/src/target-correspondence.mjs'
      - 'acceptance/real-kbs-t4r1-target-correspondence/**'
      - 'sdks/typescript/src/**'
      - '.github/workflows/productization-kbs-t4r1-target-correspondence.yml'
  pull_request:
    paths:
      - 'adapters/geox/src/target-correspondence.mjs'
      - 'acceptance/real-kbs-t4r1-target-correspondence/**'
      - 'sdks/typescript/src/**'
      - '.github/workflows/productization-kbs-t4r1-target-correspondence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kbs_t4r1_target_correspondence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Report runtime
        run: node --version
      - name: Existing GEOX target identity boundary regression
        run: node acceptance/geox-target-identity-token/integrity.mjs
      - name: Real KBS T4R1 independent target correspondence proof
        run: node acceptance/real-kbs-t4r1-target-correspondence/run.mjs
      - name: KBS T4R1 correspondence fail-closed integrity
        run: node acceptance/real-kbs-t4r1-target-correspondence/integrity.mjs
