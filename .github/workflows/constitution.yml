name: ADR Constitution

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constitutional-boundary:
    name: Constitutional boundary acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Report runtime
        run: node --version

      - name: Constitutional static checks
        run: npm run build

      - name: RA02 host static boundary
        run: node acceptance/rights-enforcement/host-boundary.mjs

      - name: RA02 host egress deny before network
        run: node acceptance/rights-enforcement/host-egress-deny.mjs

      - name: Constitutional acceptance
        run: npm test
